
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twitch Shoutout Studio</title>

<style>
:root {
  --accent: #a970ff;
  --panel: #171225;
  --width: 760px;
  --heading-size: 34px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #fff;
  background: #0c0913;
}

button, input, select { font: inherit; }

button {
  cursor: pointer;
  border: 0;
  border-radius: 8px;
  background: var(--accent);
  color: white;
  padding: 10px 14px;
  font-weight: bold;
}

button:hover { filter: brightness(1.12); }

input, select {
  width: 100%;
  padding: 10px;
  color: white;
  background: #211a30;
  border: 1px solid #493761;
  border-radius: 7px;
}

input[type="color"] {
  height: 42px;
  padding: 4px;
}

input[type="range"] {
  padding: 0;
  accent-color: var(--accent);
}

input[type="checkbox"] { accent-color: var(--accent); }

label {
  display: block;
  margin: 12px 0 6px;
}

.small {
  color: #b9afc9;
  font-size: 12px;
  line-height: 1.5;
}

#panel {
  max-width: 1100px;
  margin: auto;
  padding: 24px;
}

.columns {
  display: grid;
  grid-template-columns: minmax(240px, 330px) minmax(0, 1fr);
  gap: 24px;
}

.settings, .preview {
  min-width: 0;
  padding: 20px;
  background: var(--panel);
  border: 1px solid #382849;
  border-radius: 14px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

.status {
  min-height: 24px;
  margin-top: 10px;
  color: #d4c4f5;
  overflow-wrap: anywhere;
  font-size: 13px;
  line-height: 1.5;
}

.status.error { color: #ff9dba; }
.status.success { color: #9ff0c1; }

hr {
  border: 0;
  border-top: 1px solid #382849;
  margin-top: 20px;
}

/* Overlay */

#overlay {
  display: none;
  width: 100%;
  min-height: 100vh;
  padding: 24px;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: transparent;
}

#card {
  width: min(100%, var(--width));
  margin: auto;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity .35s ease, transform .35s ease;
}

#card.show {
  opacity: 1;
  transform: none;
}

#heading {
  margin: 0 0 16px;
  font-size: var(--heading-size);
  font-weight: 900;
  overflow-wrap: anywhere;
  text-shadow: 0 3px 15px #000;
}

/* Video */

#player {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border: 2px solid var(--accent);
  border-radius: 14px;
  background: #09070d;
  box-shadow: 0 8px 40px #0008;
}

#player iframe {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  background: #09070d;
}

/* Classic information card BELOW the video */

#details {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 16px;
  width: 82%;
  max-width: 100%;
  min-width: 0;
  margin: 16px auto 0;
  padding: 15px 22px;
  text-align: left;
  background: var(--panel);
  border: 1px solid var(--accent);
  border-radius: 14px;
  box-shadow: 0 8px 32px #0008;
}

#avatar {
  flex: 0 0 76px;
  width: 76px;
  height: 76px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--accent);
  background: #30243f;
}

#name {
  font-size: 25px;
  font-weight: 800;
  overflow-wrap: anywhere;
}

#channelUrl {
  display: inline-block;
  margin-top: 6px;
  color: #d4c4f5;
  overflow-wrap: anywhere;
  user-select: text;
}

#clipTitle {
  margin-top: 5px;
  color: #b9afc9;
  font-size: 13px;
  overflow-wrap: anywhere;
}

#clipTitle:empty { display: none; }

#overlayStatus {
  max-width: 620px;
  margin: 12px auto 0;
  color: #ffb7c8;
  overflow-wrap: anywhere;
  text-shadow: 0 2px 8px #000;
  font-size: 13px;
  line-height: 1.5;
}

#overlayStatus:empty { display: none; }

@media (max-width: 750px) {
  .columns { grid-template-columns: 1fr; }

  #heading {
    font-size: min(26px, var(--heading-size));
  }

  #details {
    width: 100%;
    gap: 10px;
    padding: 12px;
  }

  #avatar {
    flex-basis: 58px;
    width: 58px;
    height: 58px;
  }

  #name { font-size: 20px; }
}

@media (prefers-reduced-motion: reduce) {
  #card { transition: none; }
}
</style>
</head>

<body>

<div id="panel">
  <h1>Shoutout Studio</h1>
  <p class="small">
    Simple Twitch shoutout overlay with the classic card below the video.
  </p>

  <div class="columns">

    <section class="settings">
      <h2>Appearance</h2>

      <label for="accent">Accent color</label>
      <input id="accent" type="color" value="#a970ff">

      <label for="panelColor">Information card color</label>
      <input id="panelColor" type="color" value="#171225">

      <label for="fontSize">Heading size</label>
      <input id="fontSize" type="range" min="20" max="52" value="34">

      <label for="clipWidth">Maximum card width</label>
      <input id="clipWidth" type="range" min="400" max="1000" step="20" value="760">

      <label for="duration">Display duration (seconds)</label>
      <input id="duration" type="number" min="10" max="120" value="30">

      <label for="headingText">Heading text</label>
      <input id="headingText" value="GO CHECK OUT">

      <label for="fontFamily">Font</label>
      <select id="fontFamily">
        <option value="Arial, sans-serif">Arial</option>
        <option value="Verdana, sans-serif">Verdana</option>
        <option value="Georgia, serif">Georgia</option>
        <option value="'Trebuchet MS', sans-serif">Trebuchet</option>
      </select>

      <label>
        <input id="showTitle" type="checkbox" checked style="width:auto">
        Show clip title
      </label>

      <div class="actions">
        <button id="save" type="button">Save settings</button>
        <button id="reset" type="button">Reset</button>
      </div>

      <hr>

      <h2>Test shoutout</h2>

      <label for="testUser">Twitch username</label>
      <input id="testUser" value="dropzedd" placeholder="username">

      <label for="clipTimeframe">Clip timeframe</label>
      <select id="clipTimeframe">
        <option value="all">All time</option>
        <option value="year">Past year</option>
        <option value="30days">Past 30 days</option>
        <option value="featured">Featured clips only</option>
      </select>

      <p class="small">
        Your clip API worker must support the timeframe parameter
        for filtering to take effect.
      </p>

      <div class="actions">
        <button id="test" type="button">Play preview</button>
        <button id="openOverlay" type="button">Open overlay</button>
      </div>

      <p class="small">
        Use the HTTPS overlay URL as an OBS Browser Source.
      </p>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>

    <section class="preview">
      <h2>Live preview</h2>

      <iframe
        id="preview"
        title="Shoutout preview"
        style="width:100%;height:620px;border:0;border-radius:10px;background:transparent"
        allow="autoplay; fullscreen">
      </iframe>
    </section>

  </div>
</div>

<div id="overlay">
  <main id="card">
    <h1 id="heading">GO CHECK OUT</h1>

    <div id="player"></div>

    <section id="details">
      <img id="avatar" alt="Creator profile picture">

      <div style="text-align:left;min-width:0">
        <div id="name"></div>
        <div id="channelUrl"></div>
        <div id="clipTitle"></div>
      </div>
    </section>

    <div id="overlayStatus" role="status" aria-live="polite"></div>
  </main>
</div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const mode = params.get("mode") || "panel";

  const API = "https://twitch-shoutout-clips.dropzedd.workers.dev/";
  const STORE = "soSettings";

  const DEFAULTS = {
    accent: "#a970ff",
    panelColor: "#171225",
    fontSize: 34,
    clipWidth: 760,
    duration: 30,
    clipTimeframe: "all",
    headingText: "GO CHECK OUT",
    fontFamily: "Arial, sans-serif",
    showTitle: true
  };

  let settings = loadSettings();
  let requestNumber = 0;
  let hideTimer = 0;
  let cleanupTimer = 0;

  function clamp(value, min, max, fallback) {
    const n = Number(value);
    return Number.isFinite(n)
      ? Math.max(min, Math.min(max, n))
      : fallback;
  }

  function loadSettings() {
    let saved = {};

    try {
      saved = JSON.parse(localStorage.getItem(STORE) || "{}");
    } catch (_) {}

    const s = {
      ...DEFAULTS,
      ...(saved && typeof saved === "object" ? saved : {})
    };

    if (!/^#[0-9a-f]{6}$/i.test(s.accent))
      s.accent = DEFAULTS.accent;

    if (!/^#[0-9a-f]{6}$/i.test(s.panelColor))
      s.panelColor = DEFAULTS.panelColor;

    s.fontSize = clamp(s.fontSize, 20, 52, 34);
    s.clipWidth = clamp(s.clipWidth, 400, 1000, 760);
    s.duration = clamp(s.duration, 10, 120, 30);

    if (!["all", "year", "30days", "featured"].includes(s.clipTimeframe))
      s.clipTimeframe = "all";

    if (![
      "Arial, sans-serif",
      "Verdana, sans-serif",
      "Georgia, serif",
      "'Trebuchet MS', sans-serif"
    ].includes(s.fontFamily)) {
      s.fontFamily = DEFAULTS.fontFamily;
    }

    s.showTitle = typeof s.showTitle === "boolean" ? s.showTitle : true;
    s.headingText = typeof s.headingText === "string"
      ? s.headingText
      : DEFAULTS.headingText;

    return s;
  }

  function saveSettings(s) {
    try {
      localStorage.setItem(STORE, JSON.stringify(s));
      return true;
    } catch (_) {
      return false;
    }
  }

  function readForm() {
    return {
      accent: $("accent").value,
      panelColor: $("panelColor").value,
      fontSize: clamp($("fontSize").value, 20, 52, 34),
      clipWidth: clamp($("clipWidth").value, 400, 1000, 760),
      duration: clamp($("duration").value, 10, 120, 30),
      clipTimeframe: $("clipTimeframe").value,
      headingText: $("headingText").value,
      fontFamily: $("fontFamily").value,
      showTitle: $("showTitle").checked
    };
  }

  function fillForm(s) {
    Object.entries(s).forEach(([key, value]) => {
      const el = $(key);

      if (el) {
        if (el.type === "checkbox") {
          el.checked = !!value;
        } else {
          el.value = value;
        }
      }
    });
  }

  function applySettings(s) {
    const root = document.documentElement;

    root.style.setProperty("--accent", s.accent);
    root.style.setProperty("--panel", s.panelColor);
    root.style.setProperty("--width", s.clipWidth + "px");
    root.style.setProperty("--heading-size", s.fontSize + "px");

    const heading = $("heading");

    if (heading) {
      heading.textContent = s.headingText;
      heading.style.fontFamily = s.fontFamily;
    }

    const title = $("clipTitle");

    if (title) {
      title.style.display = s.showTitle ? "" : "none";
    }
  }

  function status(message, kind = "") {
    const el = $("status");

    if (el) {
      el.textContent = message;
      el.className = "status " + kind;
    }
  }

  function overlayStatus(message) {
    const el = $("overlayStatus");

    if (el) el.textContent = message || "";
  }

  function usernameOf(value) {
    const user = String(value || "").trim().replace(/^@/, "");

    if (!/^[a-zA-Z0-9_]{1,25}$/.test(user)) {
      throw new Error("Enter a valid Twitch username.");
    }

    return user;
  }

  async function getClip(user, timeframe) {
    const url = new URL(API);

    url.searchParams.set("username", user);
    url.searchParams.set("timeframe", timeframe);

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 12000);

    try {
      const response = await fetch(url, {
        signal: controller.signal,
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("Clip service returned HTTP " + response.status + ".");
      }

      const data = await response.json();

      if (data.error) throw new Error(data.error);

      return data;
    } catch (error) {
      if (error.name === "AbortError") {
        throw new Error("Clip lookup timed out.");
      }

      throw error;
    } finally {
      clearTimeout(timer);
    }
  }

  function clearMedia() {
    clearTimeout(hideTimer);
    clearTimeout(cleanupTimer);

    hideTimer = 0;
    cleanupTimer = 0;

    $("player").replaceChildren();
  }

  function showError(message, id) {
    if (id !== requestNumber) return;

    overlayStatus(message);
    $("card").classList.add("show");
  }

  function createClipEmbed(clip) {
    const slug = String(clip.slug || "").trim();

    if (!/^[a-zA-Z0-9_-]+$/.test(slug)) {
      throw new Error("The clip service did not return a valid Twitch clip ID.");
    }

    if (location.protocol !== "https:" || !location.hostname) {
      throw new Error("Twitch clips require the overlay to be hosted on HTTPS.");
    }

    const url = new URL("https://clips.twitch.tv/embed");

    url.searchParams.set("clip", slug);
    url.searchParams.set("parent", location.hostname);
    url.searchParams.set("autoplay", "true");
    url.searchParams.set("muted", "false");

    const iframe = document.createElement("iframe");

    iframe.title = "Twitch shoutout clip";
    iframe.allow = "autoplay; fullscreen; encrypted-media; picture-in-picture";
    iframe.allowFullscreen = true;
    iframe.referrerPolicy = "origin";
    iframe.loading = "eager";
    iframe.src = url.toString();

    return iframe;
  }

  async function shoutout(rawUser) {
    let user;

    try {
      user = usernameOf(rawUser);
    } catch (error) {
      overlayStatus(error.message);
      $("card").classList.add("show");
      return;
    }

    const id = ++requestNumber;

    clearMedia();

    settings = loadSettings();
    applySettings(settings);

    $("card").classList.remove("show");
    $("name").textContent = user;
    $("channelUrl").textContent = "https://www.twitch.tv/" + user;
    $("clipTitle").textContent = "";
    $("avatar").removeAttribute("src");

    overlayStatus("Looking up clip…");

    let clip;

    try {
      clip = await getClip(user, settings.clipTimeframe);
    } catch (error) {
      showError("Shoutout lookup failed: " + error.message, id);
      return;
    }

    if (id !== requestNumber) return;

    if (
      clip.profile_image_url &&
      /^https:\/\//i.test(clip.profile_image_url)
    ) {
      $("avatar").src = clip.profile_image_url;
    }

    if (clip.broadcaster_name) {
      $("name").textContent = String(clip.broadcaster_name).replace(/^@+/, "");
    }

    $("channelUrl").textContent =
      "https://www.twitch.tv/" + (clip.username || user);

    $("clipTitle").textContent =
      settings.showTitle && clip.title ? clip.title : "";

    let media;

    try {
      media = createClipEmbed(clip);
    } catch (error) {
      showError(error.message, id);
      return;
    }

    $("player").appendChild(media);
    $("card").classList.add("show");

    overlayStatus("Loading Twitch clip…");

    media.addEventListener("load", () => {
      overlayStatus("");
    }, { once: true });

    const duration = Number(clip.duration) > 0
      ? Math.max(10, Number(clip.duration) + 2)
      : settings.duration;

    hideTimer = setTimeout(() => {
      if (id !== requestNumber) return;

      $("card").classList.remove("show");

      cleanupTimer = setTimeout(() => {
        if (
          id === requestNumber &&
          !$("card").classList.contains("show")
        ) {
          clearMedia();
          overlayStatus("");
        }
      }, 400);

    }, duration * 1000);
  }

  function overlayURL(user) {
    const url = new URL(location.href);

    url.search = "";
    url.hash = "";

    url.searchParams.set("mode", "overlay");
    url.searchParams.set("username", user);

    return url.href;
  }

  /* OBS overlay mode */

  if (mode === "overlay") {
    $("panel").style.display = "none";
    $("overlay").style.display = "flex";

    settings = loadSettings();
    applySettings(settings);

    const user = params.get("username");

    if (user) {
      shoutout(user).catch(error => {
        showError("Unexpected error: " + error.message, requestNumber);
      });
    } else {
      showError(
        "Add ?mode=overlay&username=USERNAME to the URL.",
        ++requestNumber
      );
    }

    return;
  }

  /* Editor mode */

  fillForm(settings);
  applySettings(settings);

  function refreshPreview() {
    let user;

    try {
      user = usernameOf($("testUser").value || "dropzedd");
    } catch (_) {
      user = "dropzedd";
    }

    $("preview").src = overlayURL(user);
  }

  $("save").addEventListener("click", () => {
    settings = readForm();

    const ok = saveSettings(settings);

    applySettings(settings);
    refreshPreview();

    status(
      ok ? "Settings saved." : "Could not save settings in this browser.",
      ok ? "success" : "error"
    );
  });

  $("reset").addEventListener("click", () => {
    settings = { ...DEFAULTS };

    fillForm(settings);

    const ok = saveSettings(settings);

    applySettings(settings);
    refreshPreview();

    status(
      ok ? "Settings reset." : "Reset locally, but browser storage is unavailable.",
      ok ? "success" : "error"
    );
  });

  $("test").addEventListener("click", () => {
    let user;

    try {
      user = usernameOf($("testUser").value);
    } catch (error) {
      status(error.message, "error");
      return;
    }

    settings = readForm();

    saveSettings(settings);
    applySettings(settings);
    refreshPreview();

    const win = window.open(overlayURL(user), "_blank");

    status(
      win
        ? "Opened a test overlay for @" + user + "."
        : "Popup blocked; allow popups and try again.",
      win ? "success" : "error"
    );
  });

  $("openOverlay").addEventListener("click", () => {
    let user;

    try {
      user = usernameOf($("testUser").value || "dropzedd");
    } catch (error) {
      status(error.message, "error");
      return;
    }

    const win = window.open(overlayURL(user), "_blank");

    status(
      win
        ? "Opened overlay for @" + user + "."
        : "Popup blocked; allow popups and try again.",
      win ? "success" : "error"
    );
  });

  $("testUser").addEventListener("change", refreshPreview);

  [
    "accent",
    "panelColor",
    "fontSize",
    "clipWidth",
    "duration",
    "clipTimeframe",
    "headingText",
    "fontFamily",
    "showTitle"
  ].forEach(id => {
    const el = $(id);

    const update = () => {
      settings = readForm();

      applySettings(settings);
      saveSettings(settings);
      refreshPreview();
    };

    el.addEventListener("input", update);
    el.addEventListener("change", update);
  });

  window.addEventListener("storage", event => {
    if (event.key === STORE) {
      settings = loadSettings();

      fillForm(settings);
      applySettings(settings);
      refreshPreview();
    }
  });

  refreshPreview();
})();
</script>
</body>
</html>
